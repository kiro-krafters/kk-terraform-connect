AWSTemplateFormatVersion: "2010-09-09"
Description: Amazon Connect Cases - Fields, Layout, and Template for CA Bridge Connect

Parameters:
  pCasesDomainId:
    Type: String
    Description: Existing Amazon Connect Cases Domain ID

  pCustomerFieldId:
    Type: String
    Default: customer_id
    Description: System field ID for Customer

  pSummaryFieldId:
    Type: String
    Default: summary
    Description: System field ID for Summary

  pAssignedUserFieldId:
    Type: String
    Default: assigned_user
    Description: System field ID for Assigned User

  pCaseIdFieldId:
    Type: String
    Default: case_id
    Description: System field ID for Case ID

Resources:
  rCaseFieldAge:
    Type: AWS::Cases::Field
    Properties:
      DomainId: !Ref pCasesDomainId
      Name: Age
      Type: Text
      Description: Customer age

  rCaseFieldBarrierToTreatmentArrestIncarceration:
    Type: AWS::Cases::Field
    Properties:
      DomainId: !Ref pCasesDomainId
      Name: "Barrier To Treatment : Arrest Incarceration"
      Type: Boolean
      Description: Indicates if arrest or incarceration is a barrier to treatment

  rCaseFieldFor988:
    Type: AWS::Cases::Field
    Properties:
      DomainId: !Ref pCasesDomainId
      Name: "988"
      Type: Boolean
      Description: Indicates if the case was related to 988

  rCaseFieldBarrierToTreatmentHomelessOrUnstableHousing:
    Type: AWS::Cases::Field
    Properties:
      DomainId: !Ref pCasesDomainId
      Name: "Barrier To Treatment : Homeless Or Unstable Housing"
      Type: Boolean
      Description: Indicates if homeless or unstable housing is a barrier to treatment

  rCaseFieldBarrierToTreatmentInsuranceMoneyChallenges:
    Type: AWS::Cases::Field
    Properties:
      DomainId: !Ref pCasesDomainId
      Name: "Barrier To Treatment : Insurance Money Challenges"
      Type: Boolean
      Description: Indicates if insurance or money challenges is a barrier to treatment

  rCaseFieldBarrierToTreatmentNoEveningAccess:
    Type: AWS::Cases::Field
    Properties:
      DomainId: !Ref pCasesDomainId
      Name: "Barrier To Treatment : No Evening Access"
      Type: Boolean
      Description: Indicates if no evening access is a barrier to treatment

  rCaseFieldBarrierToTreatmentOther:
    Type: AWS::Cases::Field
    Properties:
      DomainId: !Ref pCasesDomainId
      Name: "Barrier To Treatment : Other"
      Type: Boolean
      Description: Indicates if other factors are a barrier to treatment

  rCaseFieldBarrierToTreatmentReportedContactWithUnfriendlyStaff:
    Type: AWS::Cases::Field
    Properties:
      DomainId: !Ref pCasesDomainId
      Name: "Barrier To Treatment : Reported Contact With Unfriendly Staff"
      Type: Boolean
      Description: Indicates if reported contact with unfriendly staff is a barrier to treatment

  rCaseFieldBarrierToTreatmentTimeConstraintsDueToWorkingOrCareOfFamilyFriend:
    Type: AWS::Cases::Field
    Properties:
      DomainId: !Ref pCasesDomainId
      Name: "Barrier To Treatment : Time Constraints Due To Working Or Care Of Family Friend"
      Type: Boolean
      Description: Indicates if time constraints due to working or care of family friend is a barrier to treatment

  rCaseFieldBarrierToTreatmentTransportation:
    Type: AWS::Cases::Field
    Properties:
      DomainId: !Ref pCasesDomainId
      Name: "Barrier To Treatment : Transportation"
      Type: Boolean
      Description: Indicates if transportation is a barrier to treatment


  rCaseFieldCaseReason:
